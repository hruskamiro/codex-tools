[metadata]
name = codex-tools
version = attr: codex_tools.__version__
description = Local Codex context utilities and reproducible structured task execution.
long_description = file: README.md
long_description_content_type = text/markdown
author = Miroslav Hruska
author_email = hruska.miro@gmail.com
license = MIT
license_files = LICENSE
url = https://github.com/hruskamiro/codex-tools
project_urls =
    Homepage = https://github.com/hruskamiro/codex-tools
    Repository = https://github.com/hruskamiro/codex-tools
    Issues = https://github.com/hruskamiro/codex-tools/issues
keywords = codex, cli, search, conversations, automation
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.10
install_requires =
    cryptography>=41.0
    jsonschema>=4.23
    PyJWT[crypto]>=2.7
    Pygments>=2.17
    tomli>=2.0; python_version < "3.11"
include_package_data = True

[options.packages.find]
include = codex_tools*

[options.package_data]
codex_tools =
    vendor/*.css
    vendor/*.js
    vendor/*.md
    vendor/*.mjs
    vendor/katex/*.css
    vendor/katex/*.js
    vendor/katex/fonts/*
    vendor/licenses/*
codex_tools.templates =
    *.md

[options.extras_require]
dev =
    build>=1.0
    twine>=5.0

[options.entry_points]
console_scripts =
    codex-tools = codex_tools.cli:main
    codex-manager = codex_tools.manager:main
    codex-viewer = codex_tools.viewer:main
